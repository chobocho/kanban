  <title>칸반 보드</title>

/* Kanban Board styles. Uses only browser-default fonts and no external assets,
   so the app runs fully offline. Layout is responsive and touch-friendly, and
   scales cleanly on foldable large screens. */

:root {
  --bg: #0d6efd;
  --toolbar-bg: #0b5ed7;
  --column-bg: #ebecf0;
  --card-bg: #ffffff;
  --text: #172b4d;
  --muted: #5e6c84;
  --radius: 8px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
  color: var(--text);
  background: var(--bg);
  /* Prevent the browser's own pinch-zoom so the app can handle it. */
  touch-action: manipulation;
  overscroll-behavior: none;
}

body {
  display: flex;
  flex-direction: column;
}

/* Toolbar -------------------------------------------------------------- */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  padding: 8px 12px;
  background: var(--toolbar-bg);
  color: #fff;
}

.app-title {
  font-size: 18px;
  margin: 0 8px 0 0;
  white-space: nowrap;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.control {
  font: inherit;
  font-size: 14px;
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.18);
  color: #fff;
  cursor: pointer;
  min-height: 36px;
}

.control:hover {
  background: rgba(255, 255, 255, 0.3);
}

select.control {
  background: #fff;
  color: var(--text);
  max-width: 180px;
}

/* Emoji icon buttons: square, centered, slightly larger glyph. */
.icon-control {
  font-size: 16px;
  line-height: 1;
  padding: 6px 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.file-label {
  display: inline-flex;
  align-items: center;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

/* Board surface -------------------------------------------------------- */
.board-surface {
  flex: 1;
  overflow: auto;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
}

.board-scale {
  transform-origin: top left;
  width: max-content;
}

.columns {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  min-height: 200px;
}

/* Column --------------------------------------------------------------- */
.column {
  width: 272px;
  flex: 0 0 auto;
  background: var(--column-bg);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 120px);
}

.column-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  font-weight: 700;
  cursor: grab;
  gap: 6px;
}

.column-title {
  flex: 1;
  word-break: break-word;
}

.cards-list {
  padding: 4px 8px;
  overflow-y: auto;
  flex: 1;
  min-height: 12px;
}

.column-footer {
  padding: 8px;
}

.add-card-btn {
  width: 100%;
  text-align: center;
  font: inherit;
  font-size: 16px;
  padding: 8px;
  border: none;
  background: transparent;
  color: var(--muted);
  border-radius: 6px;
  cursor: pointer;
}

.add-card-btn:hover {
  background: rgba(9, 30, 66, 0.08);
}

/* Card ----------------------------------------------------------------- */
.card {
  position: relative;
  background: var(--card-bg);
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 8px;
  box-shadow: 0 1px 0 rgba(9, 30, 66, 0.25);
  cursor: grab;
  overflow: hidden;
}

.card-stripe {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 6px;
}

.card-text {
  white-space: pre-wrap;
  word-break: break-word;
  min-height: 18px;
  padding-left: 4px;
}

.card-actions {
  display: flex;
  justify-content: flex-end;
  gap: 2px;
  margin-top: 4px;
  opacity: 0;
  transition: opacity 0.1s;
}

.card:hover .card-actions {
  opacity: 1;
}

.icon-btn {
  font: inherit;
  font-size: 13px;
  line-height: 1;
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
  color: var(--muted);
}

.icon-btn:hover {
  background: rgba(9, 30, 66, 0.12);
}

.empty-hint {
  color: var(--muted);
  font-size: 13px;
  padding: 6px 4px;
}

.inline-edit {
  width: 100%;
  font: inherit;
  border: 2px solid var(--bg);
  border-radius: 4px;
  padding: 6px;
  resize: vertical;
  min-height: 38px;
}

.add-column {
  flex: 0 0 auto;
  width: 272px;
  font: inherit;
  font-size: 16px;
  padding: 12px;
  border: none;
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.3);
  color: #fff;
  cursor: pointer;
  text-align: center;
}

.add-column:hover {
  background: rgba(255, 255, 255, 0.45);
}

/* Drag and drop -------------------------------------------------------- */
.drag-clone {
  position: fixed;
  z-index: 1000;
  pointer-events: none;
  opacity: 0.9;
  transform: rotate(2deg);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
}

.card-placeholder,
.column-placeholder {
  border: 2px dashed rgba(9, 30, 66, 0.35);
  border-radius: 6px;
  background: rgba(9, 30, 66, 0.06);
  margin-bottom: 8px;
}

.column-placeholder {
  flex: 0 0 auto;
}

/* Custom modal dialogs (replace native alert/confirm/prompt) ----------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(9, 30, 66, 0.5);
  padding: 16px;
  animation: modal-fade 0.12s ease-out;
}

.modal-dialog {
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  width: min(420px, 100%);
  padding: 20px;
  animation: modal-pop 0.12s ease-out;
}

.modal-message {
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}

.modal-input {
  width: 100%;
  margin-top: 14px;
  font: inherit;
  font-size: 15px;
  padding: 9px 10px;
  border: 2px solid #c1c7d0;
  border-radius: 6px;
}

.modal-input:focus {
  outline: none;
  border-color: var(--bg);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}

.modal-btn {
  font: inherit;
  font-size: 14px;
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  min-height: 38px;
}

.modal-cancel {
  background: #ebecf0;
  color: var(--text);
}

.modal-cancel:hover {
  background: #dfe1e6;
}

.modal-ok {
  background: var(--bg);
  color: #fff;
}

.modal-ok:hover {
  background: #0b5ed7;
}

@keyframes modal-fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modal-pop {
  from { transform: translateY(8px) scale(0.98); opacity: 0; }
  to { transform: none; opacity: 1; }
}

/* High-DPI / foldable large screens: show more columns comfortably. */
@media (min-width: 1600px) {
  .app-title {
    font-size: 20px;
  }
}

</style>
</head>
<body>
  <header class="toolbar">
    <h1 class="app-title" data-i18n="appTitle">칸반 보드</h1>

    <div class="toolbar-group">
      <label class="visually-hidden" for="boardSelect" data-i18n="boards">보드</label>
      <select id="boardSelect" class="control" title="boards"></select>
      <button id="newBoardBtn" class="control icon-control" data-i18n-title="newBoard">🆕</button>
      <button id="renameBoardBtn" class="control icon-control" data-i18n-title="rename">✏️</button>
      <button id="deleteBoardBtn" class="control icon-control" data-i18n-title="delete">🗑️</button>
    </div>

    <div class="toolbar-group">
      <button id="zoomOutBtn" class="control icon-control" data-i18n-title="zoomOut">🔍➖</button>
      <button id="zoomResetBtn" class="control icon-control" data-i18n-title="zoomReset">↩️</button>
      <button id="zoomInBtn" class="control icon-control" data-i18n-title="zoomIn">🔍➕</button>
    </div>

    <div class="toolbar-group">
      <button id="exportJsonBtn" class="control icon-control" data-i18n-title="exportJson">💾</button>
      <label class="control icon-control file-label" for="importJsonInput" data-i18n-title="importJson">📂</label>
      <input id="importJsonInput" type="file" accept="application/json,.json" hidden />
      <button id="exportPngBtn" class="control icon-control" data-i18n-title="exportPng">🖼️</button>
    </div>

    <div class="toolbar-group">
      <label class="visually-hidden" for="langSelect" data-i18n="language">언어</label>
      <select id="langSelect" class="control" title="language">
        <option value="ko">한국어</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>

  <main id="boardSurface" class="board-surface">
    <div id="boardScale" class="board-scale">
      <div id="columns" class="columns"></div>

  </main>
