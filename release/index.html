<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>칸반 보드</title>
  <style>
/* Kanban Board styles. Uses only browser-default fonts and no external assets,
   so the app runs fully offline. Layout is responsive and touch-friendly, and
   scales cleanly on foldable large screens. */

:root {
  --bg: #0d6efd;
  --toolbar-bg: #0b5ed7;
  --column-bg: #ebecf0;
  --card-bg: #ffffff;
  --text: #172b4d;
  --muted: #5e6c84;
  --radius: 8px;
  /* Accent (buttons, focus rings) is independent of the board canvas color. */
  --accent: #0d6efd;
  --accent-strong: #0b5ed7;
  /* Surfaces and lines for popovers, modals, inputs and hover states. */
  --panel-bg: #ffffff;
  --hover-bg: #ebecf0;
  --hover-bg-strong: #dfe1e6;
  --border: #dfe1e6;
  --input-border: #c1c7d0;
  --soft-bg: #f4f5f7;
  --overlay: rgba(9, 30, 66, 0.5);
  --tint: rgba(9, 30, 66, 0.08);
  --tint-strong: rgba(9, 30, 66, 0.12);
  --dash-border: rgba(9, 30, 66, 0.35);
  --dash-bg: rgba(9, 30, 66, 0.06);
  /* Native form controls (date pickers, checkboxes) follow the theme. */
  color-scheme: light;
}

/* Dark theme: applied by JS as html[data-theme="dark"] (setting or OS). */
html[data-theme='dark'] {
  --bg: #1d2125;
  --toolbar-bg: #14171a;
  --column-bg: #22272b;
  --card-bg: #2c333a;
  --text: #e6edf3;
  --muted: #9aa7b4;
  --accent: #579dff;
  --accent-strong: #388bff;
  --panel-bg: #282e33;
  --hover-bg: #3a4149;
  --hover-bg-strong: #454e57;
  --border: #3a4149;
  --input-border: #566069;
  --soft-bg: #22272b;
  --overlay: rgba(0, 0, 0, 0.6);
  --tint: rgba(255, 255, 255, 0.08);
  --tint-strong: rgba(255, 255, 255, 0.14);
  --dash-border: rgba(255, 255, 255, 0.35);
  --dash-bg: rgba(255, 255, 255, 0.06);
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
  color: var(--text);
  background: var(--bg);
  /* Prevent the browser's own pinch-zoom so the app can handle it. */
  touch-action: manipulation;
  overscroll-behavior: none;
}

body {
  display: flex;
  flex-direction: column;
}

/* The hidden attribute must win over component display rules (e.g. icon
   buttons set display:inline-flex, which would otherwise override it). */
[hidden] {
  display: none !important;
}

/* Toolbar -------------------------------------------------------------- */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  padding: 8px 12px;
  /* Respect a foldable/notched display's safe area so the toolbar controls are
     never hidden under a camera cutout or rounded corner. Insets are 0 on
     ordinary screens, so this is a no-op there. */
  padding-top: max(8px, env(safe-area-inset-top));
  padding-left: max(12px, env(safe-area-inset-left));
  padding-right: max(12px, env(safe-area-inset-right));
  background: var(--toolbar-bg);
  color: #fff;
}

.app-title {
  font-size: 18px;
  margin: 0 8px 0 0;
  white-space: nowrap;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.control {
  font: inherit;
  font-size: 14px;
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.18);
  color: #fff;
  cursor: pointer;
  min-height: 36px;
}

.control:hover {
  background: rgba(255, 255, 255, 0.3);
}

.control:disabled {
  opacity: 0.4;
  cursor: default;
}

.control:disabled:hover {
  background: rgba(255, 255, 255, 0.18);
}

select.control {
  background: var(--panel-bg);
  color: var(--text);
  max-width: 180px;
}

/* Emoji icon buttons: square, centered, slightly larger glyph. */
.icon-control {
  font-size: 16px;
  line-height: 1;
  padding: 6px 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.file-label {
  display: inline-flex;
  align-items: center;
}

/* Search / filter -------------------------------------------------------- */
.filter-group {
  position: relative;
}

.filter-input {
  background: var(--panel-bg);
  color: var(--text);
  max-width: 180px;
}

.filter-input::placeholder {
  color: var(--muted);
}

/* The filter button glows when a filter is active. */
.icon-control.is-active {
  background: var(--panel-bg);
  color: var(--accent);
}

.filter-panel {
  position: absolute;
  top: 100%;
  right: 0;
  z-index: 1500;
  margin-top: 6px;
  width: 240px;
  padding: 12px;
  background: var(--panel-bg);
  color: var(--text);
  border-radius: 8px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
}

.filter-panel-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin: 4px 0 6px;
}

.filter-label-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.filter-label-chip {
  min-height: 28px;
  min-width: 40px;
  padding: 0 8px;
  border: none;
  border-radius: 6px;
  color: #fff;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  opacity: 0.85;
}

.filter-label-chip.is-on {
  opacity: 1;
  box-shadow: inset 0 0 0 2px var(--text);
}

.filter-due-select {
  width: 100%;
  max-width: none;
  margin-top: 2px;
  background: var(--panel-bg);
  color: var(--text);
  border: 2px solid var(--input-border);
}

.filter-panel-clear {
  width: 100%;
  margin-top: 12px;
  font: inherit;
  font-size: 14px;
  padding: 8px;
  border: none;
  border-radius: 6px;
  background: var(--hover-bg);
  color: var(--text);
  cursor: pointer;
}

.filter-panel-clear:hover {
  background: var(--hover-bg-strong);
}

/* Overflow menu (☰) -------------------------------------------------------- */
.menu-group {
  position: relative;
  margin-left: auto; /* push the menu to the far end of the toolbar */
}

.menu-panel {
  position: absolute;
  top: 100%;
  right: 0;
  z-index: 1500;
  margin-top: 6px;
  width: 230px;
  max-height: 80vh;
  max-height: 80dvh;
  overflow-y: auto;
  padding: 8px;
  background: var(--panel-bg);
  color: var(--text);
  border-radius: 8px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
}

.menu-section {
  padding: 4px 0;
}

.menu-section + .menu-section {
  border-top: 1px solid var(--border);
}

.menu-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  padding: 6px 8px 4px;
}

.menu-item,
.menu-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  box-sizing: border-box;
  padding: 8px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 14px;
  text-align: left;
  cursor: pointer;
}

.menu-item:hover {
  background: var(--hover-bg);
}

.menu-item:disabled {
  opacity: 0.4;
  cursor: default;
}

.menu-item:disabled:hover {
  background: transparent;
}

.menu-icon {
  flex: 0 0 auto;
  width: 22px;
  text-align: center;
}

.menu-select {
  flex: 1 1 auto;
  background: var(--panel-bg);
  color: var(--text);
  border: 2px solid var(--input-border);
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

/* Narrow screens: drop the title and let the search box shrink so the
   essential controls (board, undo/redo, search, menu) fit on one row. */
@media (max-width: 640px) {
  .app-title {
    display: none;
  }
  .filter-input {
    width: 0;
    min-width: 80px;
    flex: 1 1 auto;
  }
  .toolbar {
    gap: 6px;
  }
}

/* Board surface -------------------------------------------------------- */
.board-surface {
  flex: 1;
  overflow: auto;
  padding: 16px;
  /* Keep the board clear of the screen's safe area on foldable/notched devices
     (no effect where the insets are 0). */
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  padding-bottom: max(16px, env(safe-area-inset-bottom));
  -webkit-overflow-scrolling: touch;
}

.board-scale {
  transform-origin: top left;
  width: max-content;
}

.columns {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  min-height: 200px;
}

/* Column --------------------------------------------------------------- */
.column {
  width: 272px;
  flex: 0 0 auto;
  background: var(--column-bg);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  /* JS (LayoutController) sets --column-max-h to the real visible board height,
     so columns never overflow when a foldable opens/closes or the toolbar
     wraps. The calc() fallbacks apply before scripts run or on old browsers;
     dvh tracks the dynamic viewport (browser chrome) better than vh. */
  max-height: calc(100vh - 120px);
  max-height: var(--column-max-h, calc(100dvh - 120px));
}

.column-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  font-weight: 700;
  cursor: grab;
  gap: 6px;
}

.column-title {
  flex: 1;
  word-break: break-word;
}

/* The list's ⋯ menu (sort / copy / move all / archive). */
.column-menu-wrap {
  position: relative;
  flex: 0 0 auto;
}

.column-menu {
  position: absolute;
  top: 100%;
  right: 0;
  z-index: 1200;
  margin-top: 4px;
  width: 210px;
  padding: 6px;
  background: var(--panel-bg);
  color: var(--text);
  border-radius: 8px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
  cursor: default;
}

.column-menu-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  padding: 6px 8px 2px;
}

.column-menu-item {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 7px 8px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  font-weight: 400;
  text-align: left;
  cursor: pointer;
}

.column-menu-item:hover {
  background: var(--hover-bg);
}

/* Card count in a column header (matches/total while a filter is active). */
.column-count {
  flex: 0 0 auto;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  background: var(--tint);
  padding: 1px 6px;
  border-radius: 8px;
}

.cards-list {
  padding: 4px 8px;
  overflow-y: auto;
  flex: 1;
  min-height: 12px;
}

.column-footer {
  padding: 8px;
}

.add-card-btn {
  width: 100%;
  text-align: center;
  font: inherit;
  font-size: 16px;
  padding: 8px;
  border: none;
  background: transparent;
  color: var(--muted);
  border-radius: 6px;
  cursor: pointer;
}

.add-card-btn:hover {
  background: var(--tint);
}

/* Card ----------------------------------------------------------------- */
.card {
  position: relative;
  background: var(--card-bg);
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 8px;
  box-shadow: 0 1px 0 rgba(9, 30, 66, 0.25);
  cursor: grab;
  overflow: hidden;
}

.card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.card-stripe {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 6px;
}

.card-text {
  white-space: pre-wrap;
  word-break: break-word;
  min-height: 18px;
  padding-left: 4px;
}

.card-actions {
  display: flex;
  justify-content: flex-end;
  gap: 2px;
  margin-top: 4px;
  opacity: 0;
  /* Hidden actions must not be tappable; otherwise a touch on the invisible
     delete button would remove the card. Re-enabled together with opacity. */
  pointer-events: none;
  transition: opacity 0.1s;
}

.card:hover .card-actions {
  opacity: 1;
  pointer-events: auto;
}

/* Touch devices have no hover, so the actions would stay invisible yet remain
   in the layout. Keep them visible (and tappable) there. */
@media (hover: none) {
  .card-actions {
    opacity: 1;
    pointer-events: auto;
  }
}

.icon-btn {
  font: inherit;
  font-size: 13px;
  line-height: 1;
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
  color: var(--muted);
}

.icon-btn:hover {
  background: var(--tint-strong);
}

.empty-hint {
  color: var(--muted);
  font-size: 13px;
  padding: 6px 4px;
}

.inline-edit-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.inline-edit {
  width: 100%;
  font: inherit;
  line-height: 1.4;
  box-sizing: border-box;
  border: 2px solid var(--accent);
  border-radius: 4px;
  padding: 6px;
  /* Height is managed by autoGrow() (grows with content up to 20 lines). */
  resize: none;
  overflow-y: hidden;
  min-height: 38px;
}

.inline-edit-actions {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
}

.inline-edit-btn {
  font: inherit;
  font-size: 14px;
  line-height: 1;
  /* Roomy tap target for touch devices. */
  min-width: 36px;
  min-height: 32px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

.inline-edit-ok {
  background: var(--accent);
  color: #fff;
}

.inline-edit-cancel {
  background: var(--tint-strong);
  color: var(--text);
}

.add-column {
  flex: 0 0 auto;
  width: 272px;
  font: inherit;
  font-size: 16px;
  padding: 12px;
  border: none;
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.3);
  color: #fff;
  cursor: pointer;
  text-align: center;
}

.add-column:hover {
  background: rgba(255, 255, 255, 0.45);
}

/* Drag and drop -------------------------------------------------------- */
.drag-clone {
  position: fixed;
  z-index: 1000;
  pointer-events: none;
  opacity: 0.9;
  transform: rotate(2deg);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
}

.card-placeholder,
.column-placeholder {
  border: 2px dashed var(--dash-border);
  border-radius: 6px;
  background: var(--dash-bg);
  margin-bottom: 8px;
}

.column-placeholder {
  flex: 0 0 auto;
}

/* Custom modal dialogs (replace native alert/confirm/prompt) ----------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--overlay);
  padding: 16px;
  animation: modal-fade 0.12s ease-out;
}

.modal-dialog {
  background: var(--panel-bg);
  border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  width: min(420px, 100%);
  padding: 20px;
  animation: modal-pop 0.12s ease-out;
}

.modal-message {
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}

.modal-input {
  width: 100%;
  margin-top: 14px;
  font: inherit;
  font-size: 15px;
  padding: 9px 10px;
  border: 2px solid var(--input-border);
  border-radius: 6px;
}

.modal-textarea {
  resize: vertical;
  line-height: 1.5;
}

.modal-input:focus {
  outline: none;
  border-color: var(--accent);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}

.modal-btn {
  font: inherit;
  font-size: 14px;
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  min-height: 38px;
}

.modal-cancel {
  background: var(--hover-bg);
  color: var(--text);
}

.modal-cancel:hover {
  background: var(--hover-bg-strong);
}

.modal-ok {
  background: var(--accent);
  color: #fff;
}

.modal-ok:hover {
  background: var(--accent-strong);
}

/* --- Card detail modal (back of the card) --- */
.card-detail {
  width: min(560px, 100%);
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
}

.card-detail-label {
  margin-top: 14px;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

.card-detail-label:first-child {
  margin-top: 0;
}

.card-detail-title {
  margin-top: 0;
}

.card-detail-desc {
  width: 100%;
  box-sizing: border-box;
  font: inherit;
  font-size: 15px;
  line-height: 1.5;
  min-height: 120px;
  resize: vertical;
  padding: 9px 10px;
  border: 2px solid var(--input-border);
  border-radius: 6px;
}

.card-detail-desc:focus {
  outline: none;
  border-color: var(--accent);
}

/* Rendered markdown preview of the description (click to edit). */
.card-detail-desc-preview {
  padding: 10px;
  background: var(--soft-bg);
  border-radius: 6px;
  cursor: pointer;
  font-size: 15px;
  line-height: 1.5;
  word-break: break-word;
}

.card-detail-desc-preview p {
  margin: 0 0 8px;
  white-space: pre-wrap;
}

.card-detail-desc-preview h1,
.card-detail-desc-preview h2,
.card-detail-desc-preview h3 {
  margin: 12px 0 6px;
  line-height: 1.3;
}

.card-detail-desc-preview h1 { font-size: 20px; }
.card-detail-desc-preview h2 { font-size: 17px; }
.card-detail-desc-preview h3 { font-size: 15px; }

.card-detail-desc-preview ul,
.card-detail-desc-preview ol {
  margin: 0 0 8px;
  padding-left: 22px;
}

.card-detail-desc-preview pre {
  margin: 0 0 8px;
  padding: 8px 10px;
  background: var(--hover-bg);
  border-radius: 6px;
  overflow-x: auto;
  font-size: 13px;
}

.card-detail-desc-preview code {
  background: var(--hover-bg);
  border-radius: 4px;
  padding: 1px 4px;
  font-size: 13px;
}

.card-detail-desc-preview pre code {
  background: transparent;
  padding: 0;
}

.card-detail-desc-preview a {
  color: var(--accent);
}

.card-detail-desc-preview > :first-child {
  margin-top: 0;
}

.card-detail-desc-preview > :last-child {
  margin-bottom: 0;
}

.card-detail-colors {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.card-detail-swatch {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  border: 2px solid var(--input-border);
  cursor: pointer;
  padding: 0;
}

.card-detail-swatch.is-none {
  /* The "no accent" swatch shows a diagonal slash over white. */
  background:
    linear-gradient(to top right, transparent 45%, #eb5a46 45%, #eb5a46 55%, transparent 55%),
    var(--panel-bg);
}

.card-detail-swatch.is-selected {
  border-color: var(--text);
  box-shadow: 0 0 0 2px var(--accent);
}

.card-detail-meta {
  margin-top: 16px;
  font-size: 12px;
  color: var(--muted);
}

/* Checklist inside the card detail modal. */
.card-detail-checklist {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* One named checklist group inside the card detail modal. */
.checklist-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
}

.checklist-group-header {
  display: flex;
  align-items: center;
  gap: 8px;
}

.checklist-group-name {
  font-weight: 600;
}


.checklist-progress-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.checklist-progress-text {
  flex: 0 0 auto;
  font-size: 12px;
  color: var(--muted);
  min-width: 28px;
}

.checklist-progress {
  flex: 1 1 auto;
  height: 8px;
  border-radius: 4px;
  background: var(--hover-bg);
  overflow: hidden;
}

.checklist-progress-fill {
  height: 100%;
  background: #61bd4f;
  transition: width 0.15s;
}

.checklist-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.checklist-item-text {
  flex: 1 1 auto;
  font: inherit;
  font-size: 14px;
  padding: 6px 8px;
  border: 1px solid transparent;
  border-radius: 6px;
}

.checklist-item-text:hover {
  border-color: var(--border);
}

.checklist-item-text:focus {
  outline: none;
  border-color: var(--accent);
}

.checklist-item-text.is-done {
  text-decoration: line-through;
  color: var(--muted);
}

.checklist-item-del {
  flex: 0 0 auto;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  padding: 4px;
  border-radius: 4px;
}

.checklist-item-del:hover {
  background: var(--hover-bg);
}

.checklist-item-del:disabled {
  opacity: 0.3;
  cursor: default;
}

.checklist-item-del:disabled:hover {
  background: transparent;
}

.checklist-add {
  display: flex;
  gap: 6px;
  margin-top: 2px;
}

.checklist-add-input {
  flex: 1 1 auto;
  font: inherit;
  font-size: 14px;
  padding: 7px 8px;
  border: 2px solid var(--input-border);
  border-radius: 6px;
}

.checklist-add-input:focus {
  outline: none;
  border-color: var(--accent);
}

.checklist-add-btn,
.comment-add-btn {
  flex: 0 0 auto;
  font: inherit;
  font-size: 14px;
  padding: 7px 12px;
  border: none;
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}

/* Soft (neutral) buttons in the card detail modal: add-label/file/checklist
   and the copy/move/template actions. */
.card-detail-label-add,
.attachment-add-btn,
.checklist-group-add,
.card-detail-op-btn {
  align-self: flex-start;
  font: inherit;
  font-size: 13px;
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  background: var(--hover-bg);
  cursor: pointer;
}

.card-detail-label-add:hover,
.attachment-add-btn:hover,
.checklist-group-add:hover,
.card-detail-op-btn:hover {
  background: var(--hover-bg-strong);
}

/* Card actions (copy/move) inside the card detail modal. */
.card-detail-ops {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.card-detail-op-btn {
  font-size: 14px;
  padding: 7px 12px;
}

.card-detail-move {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  align-items: center;
}

.card-detail-move-select {
  flex: 1 1 auto;
  min-width: 0;
}

/* Attachments inside the card detail modal. */
.card-detail-attachments {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.attachment-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px;
  border-radius: 6px;
  background: var(--soft-bg);
}

.attachment-thumb {
  flex: 0 0 auto;
  width: 64px;
  height: 48px;
  object-fit: cover;
  border-radius: 4px;
  background: var(--hover-bg-strong);
}

.attachment-info {
  flex: 1 1 auto;
  min-width: 0;
}

.attachment-name {
  font-size: 13px;
  word-break: break-all;
}

.attachment-date {
  font-size: 11px;
  color: var(--muted);
}

/* Template badge on the card front. */
.card-template {
  background: #e4f0f6;
  color: #0c66e4;
  font-weight: 600;
}

/* Cover image on the card front (the first attachment). */
.card-cover {
  display: block;
  width: 100%;
  max-height: 140px;
  object-fit: cover;
  border-radius: var(--radius) var(--radius) 0 0;
  pointer-events: none;
}

/* Comments inside the card detail modal. */
.card-detail-comments {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.comment-add {
  display: flex;
  gap: 6px;
  align-items: flex-start;
}

.comment-add-input {
  flex: 1 1 auto;
  font: inherit;
  font-size: 14px;
  padding: 7px 8px;
  border: 2px solid var(--input-border);
  border-radius: 6px;
  resize: vertical;
}

.comment-add-input:focus {
  outline: none;
  border-color: var(--accent);
}


.comment-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px;
  border-radius: 6px;
  background: var(--soft-bg);
}

.comment-meta {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--muted);
}

.comment-date {
  flex: 1 1 auto;
}

.comment-btn {
  flex: 0 0 auto;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  padding: 3px 5px;
  border-radius: 4px;
}

.comment-btn:hover {
  background: var(--hover-bg);
}

.comment-text {
  font-size: 14px;
  white-space: pre-wrap;
  word-break: break-word;
}

.comment-edit-actions {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
}

.card-detail .card-detail-delete {
  /* Push the delete button to the far left, away from cancel/save. */
  margin-right: auto;
  background: #ffebe6;
  color: #bf2600;
}

.card-detail .card-detail-delete:hover {
  background: #ffd6cc;
}

/* --- Activity view --- */
.activity-row {
  padding: 8px;
  border-radius: 6px;
}

.activity-row:nth-child(odd) {
  background: var(--soft-bg);
}

.activity-text {
  font-size: 14px;
  word-break: break-word;
}

.activity-when {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

/* --- Archive view --- */
.card-archive {
  width: min(560px, 100%);
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
}

.archive-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}

.archive-empty {
  color: var(--muted);
  font-size: 14px;
  padding: 12px 4px;
  text-align: center;
}

.archive-section-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin: 6px 0 2px;
}

.archive-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
}

.archive-info {
  flex: 1 1 auto;
  min-width: 0;
}

.archive-text {
  white-space: pre-wrap;
  word-break: break-word;
}

.archive-origin {
  margin-top: 2px;
  font-size: 12px;
  color: var(--muted);
}

.archive-btn {
  flex: 0 0 auto;
  font: inherit;
  font-size: 13px;
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  min-height: 32px;
}

.archive-restore {
  background: var(--accent);
  color: #fff;
}

.archive-delete {
  background: #ffebe6;
  color: #bf2600;
}

.archive-delete:hover {
  background: #ffd6cc;
}

/* --- All-boards calendar view --- */
.calendar-view {
  width: min(860px, 100%);
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
}

.calendar-head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

/* Month/week segmented toggle. */
.calendar-mode-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

.calendar-mode-btn {
  font: inherit;
  font-size: 13px;
  padding: 6px 10px;
  border: none;
  background: var(--soft-bg);
  color: var(--text);
  cursor: pointer;
  min-height: 32px;
}

.calendar-mode-btn:hover {
  background: var(--hover-bg);
}

.calendar-mode-btn.is-active {
  background: var(--accent);
  color: #fff;
}

.calendar-title {
  flex: 1 1 auto;
  text-align: center;
  font-size: 16px;
  font-weight: 700;
}

.calendar-nav-btn {
  flex: 0 0 auto;
  font: inherit;
  font-size: 13px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--soft-bg);
  color: var(--text);
  cursor: pointer;
  min-height: 32px;
}

.calendar-nav-btn:hover {
  background: var(--hover-bg);
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  margin-top: 12px;
}

.calendar-weekday {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  padding: 2px 0;
}

/* Weekend accents (weekday headers and day numbers): Sunday red, Saturday
   blue, with lighter shades in the dark theme for contrast. */
.calendar-weekday.is-sun,
.calendar-day-num.is-sun {
  color: #d93025;
}

.calendar-weekday.is-sat,
.calendar-day-num.is-sat {
  color: #1a73e8;
}

html[data-theme='dark'] .calendar-weekday.is-sun,
html[data-theme='dark'] .calendar-day-num.is-sun {
  color: #ff7b6e;
}

html[data-theme='dark'] .calendar-weekday.is-sat,
html[data-theme='dark'] .calendar-day-num.is-sat {
  color: #7cb2ff;
}

.calendar-cell {
  min-height: 68px;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--soft-bg);
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow: hidden;
  /* Clicking a cell's empty area creates a card due on that day. */
  cursor: pointer;
}

.calendar-cell:hover {
  border-color: var(--accent);
}

.calendar-cell.is-outside {
  opacity: 0.45;
  background: transparent;
}

/* Week mode: a single row of tall cells with room for more entries. */
.calendar-grid.is-week .calendar-cell {
  min-height: 220px;
}

.calendar-cell.is-today {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.calendar-day-num {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}

.calendar-cell.is-today .calendar-day-num {
  color: var(--accent);
}

.calendar-event {
  display: block;
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: 11px;
  line-height: 1.3;
  padding: 2px 4px;
  border: none;
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  background: var(--card-bg);
  color: var(--text);
  cursor: pointer;
  box-shadow: 0 1px 1px var(--tint);
  /* Chips are draggable onto other days; handle the pointer moves ourselves. */
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.calendar-event.is-dragging {
  opacity: 0.5;
}

.calendar-cell.is-drop-target {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
  background: var(--hover-bg);
}

.calendar-event:hover {
  background: var(--hover-bg);
}

/* Range bars: one segment per day, half-rounded at the ends so the pieces
   read as one continuous span across the cell gaps. */
.calendar-event.is-seg-start {
  border-radius: 4px 0 0 4px;
}

.calendar-event.is-seg-end {
  border-radius: 0 4px 4px 0;
  border-left-color: transparent;
}

.calendar-event.is-seg-middle {
  height: 8px;
  padding: 0;
  border-left: none;
  border-radius: 0;
  background: var(--accent);
  opacity: 0.55;
}

.calendar-event.is-seg-middle:hover {
  opacity: 0.9;
}

.calendar-event.is-overdue {
  background: #ffebe6;
  color: #bf2600;
}

.calendar-event.is-seg-middle.is-overdue {
  background: #e5493a;
}

.calendar-event.is-done {
  opacity: 0.7;
  text-decoration: line-through;
}

.calendar-event.is-seg-middle.is-done {
  opacity: 0.35;
}

.calendar-event-board,
.calendar-event-text {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.calendar-event-board {
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
}

.calendar-event.is-overdue .calendar-event-board {
  color: inherit;
}

.calendar-empty {
  margin-top: 10px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}

/* Phones: keep all 7 columns visible with tighter cells. */
@media (max-width: 560px) {
  .calendar-cell {
    min-height: 52px;
    padding: 2px;
  }

  .calendar-event-board {
    display: none;
  }
}

/* Labels assigned to a card, shown as chips above the card text. */
.card-labels {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 6px;
}

.card-label {
  min-width: 36px;
  max-width: 100%;
  height: 16px;
  padding: 0 6px;
  border-radius: 8px;
  font-size: 11px;
  line-height: 16px;
  color: #fff;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Label rows inside the card detail modal. */
.card-detail-labels {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.card-detail-label-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-detail-label-chip {
  flex: 1 1 auto;
  min-height: 32px;
  padding: 0 10px;
  border: none;
  border-radius: 6px;
  color: #fff;
  font: inherit;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  opacity: 0.85;
}

.card-detail-label-chip.is-on {
  opacity: 1;
  box-shadow: inset 0 0 0 2px var(--text);
}

.card-detail-label-edit {
  flex: 0 0 auto;
  min-width: 36px;
  min-height: 32px;
  border: none;
  border-radius: 6px;
  background: var(--hover-bg);
  cursor: pointer;
  font-size: 14px;
}

.card-detail-label-edit:hover {
  background: var(--hover-bg-strong);
}

/* Description / due-date badges on the card face. */
.card-badges {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
}

.card-badge {
  font-size: 12px;
  line-height: 1;
  opacity: 0.7;
}

.card-due,
.card-check {
  display: inline-flex;
  align-items: center;
  padding: 2px 6px;
  border-radius: 6px;
  font-weight: 600;
  opacity: 1;
  background: var(--hover-bg);
  color: var(--text);
}

/* The ☑️ badge is a button (it toggles the inline checklist view). */
button.card-check {
  border: none;
  cursor: pointer;
  font: inherit;
  font-size: 12px;
}

.card-check.is-complete {
  background: #e3fcef;
  color: #006644;
}

/* Checklists expanded inline on the card front via the ☑️ badge. */
.card-checklists {
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin-top: 6px;
}

.card-checklist-name {
  font-size: 11px;
  font-weight: 700;
  opacity: 0.6;
  margin-top: 3px;
}

.card-check-item {
  display: block;
  width: 100%;
  border: none;
  background: none;
  text-align: left;
  font: inherit;
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--text);
  padding: 2px 4px;
  border-radius: 4px;
  cursor: pointer;
}

.card-check-item:hover {
  background: var(--hover-bg);
}

.card-check-item.is-done {
  text-decoration: line-through;
  opacity: 0.55;
}

.card-due.is-overdue {
  background: #ffebe6;
  color: #bf2600;
}

.card-due.is-soon {
  background: #fffae6;
  color: #974f0c;
}

.card-due.is-done {
  background: #e3fcef;
  color: #006644;
  text-decoration: line-through;
}

/* Due-date controls inside the card detail modal. */
.card-detail-due {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.card-detail-due-input {
  font: inherit;
  font-size: 15px;
  padding: 8px 10px;
  border: 2px solid var(--input-border);
  border-radius: 6px;
}

.card-detail-due-input:focus {
  outline: none;
  border-color: var(--accent);
}

.card-detail-due-done {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--text);
  cursor: pointer;
}

.card-detail-due-clear {
  font: inherit;
  font-size: 14px;
  padding: 7px 12px;
  border: none;
  border-radius: 6px;
  background: var(--hover-bg);
  color: var(--text);
  cursor: pointer;
}

.card-detail-due-clear:hover {
  background: var(--hover-bg-strong);
}

@keyframes modal-fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modal-pop {
  from { transform: translateY(8px) scale(0.98); opacity: 0; }
  to { transform: none; opacity: 1; }
}

/* High-DPI / foldable large screens: show more columns comfortably. */
@media (min-width: 1600px) {
  .app-title {
    font-size: 20px;
  }
}

        <div class="menu-section">

// Generic undo/redo history. Pure and free of any DOM/storage concerns so it
// can be unit tested in isolation (see test/history.test.ts).
//

// (for undo) and the undone states (for redo). The number of undo steps is
// capped by `maxDepth` so memory stays bounded.

     * redo history is discarded because a fresh change forks the timeline.

     * there is nothing to undo.

}

}

 * Overlay + dialog scaffold shared by the promise-based modals. Wires Escape
 * and outside-click to close, guards against double-close, and runs `onClosed`
 * exactly once after the modal is removed. Callers build content into
 * `dialog` and call `close()` (setting any result beforehand).
 */
function openShell(dialogClass, onClosed) {

    overlay.className = 'modal-overlay';
    const dialog = document.createElement('div');
    dialog.className = dialogClass ? `modal-dialog ${dialogClass}` : 'modal-dialog';
    dialog.setAttribute('role', 'dialog');
    dialog.setAttribute('aria-modal', 'true');
    overlay.appendChild(dialog);
    let settled = false;
    const close = () => {
        if (settled)
            return;
        settled = true;
        document.removeEventListener('keydown', onKey, true);
        overlay.remove();
        onClosed();
    };
    const onKey = (e) => {
        if (e.key === 'Escape') {
            e.preventDefault();
            close();
        }
    };
    overlay.addEventListener('pointerdown', (e) => {
        if (e.target === overlay)
            close();
    });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(overlay);
    return { dialog, close };
}
/** Build a row of color swatches; keeps the selected marker in sync itself. */
function buildSwatchRow(colors, current, onPick) {
    const row = document.createElement('div');
    row.className = 'card-detail-colors';
    for (const color of colors) {
        const swatch = document.createElement('button');
        swatch.className = 'card-detail-swatch';
        swatch.style.background = color || 'transparent';
        if (!color)
            swatch.classList.add('is-none'); // shows a "no color" hint
        if (color === current)
            swatch.classList.add('is-selected');
        swatch.addEventListener('click', () => {
            row.querySelectorAll('.card-detail-swatch').forEach((s) => s.classList.remove('is-selected'));
            swatch.classList.add('is-selected');
            onPick(color);
        });
        row.appendChild(swatch);
    }

}
/**
 * Multi-line prompt: a textarea with OK/cancel. Resolves with the entered text,
 * or null when cancelled. Enter inserts a newline; Escape cancels.
 */
function customTextPrompt(message, placeholder = '') {
    return new Promise((resolve) => {
        let result = null;
        const { dialog, close } = openShell('', () => resolve(result));
        const title = document.createElement('div');
        title.className = 'modal-message';
        title.textContent = message;
        dialog.appendChild(title);
        const input = document.createElement('textarea');
        input.className = 'modal-input modal-textarea';
        input.placeholder = placeholder;
        input.rows = 6;
        dialog.appendChild(input);
        const actions = document.createElement('div');
        actions.className = 'modal-actions';
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'modal-btn modal-cancel';
        cancelBtn.textContent = t('cancel');
        cancelBtn.addEventListener('click', () => close());
        const okBtn = document.createElement('button');
        okBtn.className = 'modal-btn modal-ok';
        okBtn.textContent = t('ok');
        okBtn.addEventListener('click', () => {

        actions.append(cancelBtn, okBtn);
        dialog.appendChild(actions);

/**

 * cancelled. An empty-string color renders as a "no color / default" swatch.

        cancelBtn.className = 'modal-btn modal-cancel';

/** Convert a timestamp to a `datetime-local` input value in local time. */
function toLocalInputValue(ts) {
    const d = new Date(ts);
    const pad = (n) => String(n).padStart(2, '0');
    return (`${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` +
        `T${pad(d.getHours())}:${pad(d.getMinutes())}`);
}
/** Parse a `datetime-local` value (local time) back into a timestamp or null. */
function fromLocalInputValue(value) {
    if (!value)
        return null;
    const ts = new Date(value).getTime();
    return Number.isFinite(ts) ? ts : null;
}
/** Format a timestamp using the active language's locale. */
function formatDate(ts) {
    const locale = getLanguage() === 'en' ? 'en-US' : 'ko-KR';
    return new Date(ts).toLocaleString(locale);
}
