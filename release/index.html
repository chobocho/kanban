<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>칸반 보드</title>
  <style>
/* Kanban Board styles. Uses only browser-default fonts and no external assets,
   so the app runs fully offline. Layout is responsive and touch-friendly, and
   scales cleanly on foldable large screens. */

:root {
  --bg: #0d6efd;
  --toolbar-bg: #0b5ed7;
  --column-bg: #ebecf0;
  --card-bg: #ffffff;
  --text: #172b4d;
  --muted: #5e6c84;
  --radius: 8px;
  /* Accent (buttons, focus rings) is independent of the board canvas color. */
  --accent: #0d6efd;
  --accent-strong: #0b5ed7;
  /* Surfaces and lines for popovers, modals, inputs and hover states. */
  --panel-bg: #ffffff;
  --hover-bg: #ebecf0;
  --hover-bg-strong: #dfe1e6;
  --border: #dfe1e6;
  --input-border: #c1c7d0;
  --soft-bg: #f4f5f7;
  --overlay: rgba(9, 30, 66, 0.5);
  --tint: rgba(9, 30, 66, 0.08);
  --tint-strong: rgba(9, 30, 66, 0.12);
  --dash-border: rgba(9, 30, 66, 0.35);
  --dash-bg: rgba(9, 30, 66, 0.06);
  /* Native form controls (date pickers, checkboxes) follow the theme. */
  color-scheme: light;
}

/* Dark theme: applied by JS as html[data-theme="dark"] (setting or OS). */
html[data-theme='dark'] {
  --bg: #1d2125;
  --toolbar-bg: #14171a;
  --column-bg: #22272b;
  --card-bg: #2c333a;
  --text: #e6edf3;
  --muted: #9aa7b4;
  --accent: #579dff;
  --accent-strong: #388bff;
  --panel-bg: #282e33;
  --hover-bg: #3a4149;
  --hover-bg-strong: #454e57;
  --border: #3a4149;
  --input-border: #566069;
  --soft-bg: #22272b;
  --overlay: rgba(0, 0, 0, 0.6);
  --tint: rgba(255, 255, 255, 0.08);
  --tint-strong: rgba(255, 255, 255, 0.14);
  --dash-border: rgba(255, 255, 255, 0.35);
  --dash-bg: rgba(255, 255, 255, 0.06);
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
  color: var(--text);
  background: var(--bg);
  /* Prevent the browser's own pinch-zoom so the app can handle it. */
  touch-action: manipulation;
  overscroll-behavior: none;
}

body {
  display: flex;
  flex-direction: column;
}

/* The hidden attribute must win over component display rules (e.g. icon
   buttons set display:inline-flex, which would otherwise override it). */
[hidden] {
  display: none !important;
}

/* Toolbar -------------------------------------------------------------- */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  padding: 8px 12px;
  /* Respect a foldable/notched display's safe area so the toolbar controls are
     never hidden under a camera cutout or rounded corner. Insets are 0 on
     ordinary screens, so this is a no-op there. */
  padding-top: max(8px, env(safe-area-inset-top));
  padding-left: max(12px, env(safe-area-inset-left));
  padding-right: max(12px, env(safe-area-inset-right));
  background: var(--toolbar-bg);
  color: #fff;
}

.app-title {
  font-size: 18px;
  margin: 0 8px 0 0;
  white-space: nowrap;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.control {
  font: inherit;
  font-size: 14px;
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.18);
  color: #fff;
  cursor: pointer;
  min-height: 36px;
}

.control:hover {
  background: rgba(255, 255, 255, 0.3);
}

.control:disabled {
  opacity: 0.4;
  cursor: default;
}

.control:disabled:hover {
  background: rgba(255, 255, 255, 0.18);
}

select.control {
  background: var(--panel-bg);
  color: var(--text);
  max-width: 180px;
}

/* Emoji icon buttons: square, centered, slightly larger glyph. */
.icon-control {
  font-size: 16px;
  line-height: 1;
  padding: 6px 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.file-label {
  display: inline-flex;
  align-items: center;
}

/* Search / filter -------------------------------------------------------- */
.filter-group {
  position: relative;
}

.filter-input {
  background: var(--panel-bg);
  color: var(--text);
  max-width: 180px;
}

.filter-input::placeholder {
  color: var(--muted);
}

/* The filter button glows when a filter is active. */
.icon-control.is-active {
  background: var(--panel-bg);
  color: var(--accent);
}

.filter-panel {
  position: absolute;
  top: 100%;
  right: 0;
  z-index: 1500;
  margin-top: 6px;
  width: 240px;
  padding: 12px;
  background: var(--panel-bg);
  color: var(--text);
  border-radius: 8px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
}

.filter-panel-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin: 4px 0 6px;
}

.filter-label-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.filter-label-chip {
  min-height: 28px;
  min-width: 40px;
  padding: 0 8px;
  border: none;
  border-radius: 6px;
  color: #fff;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  opacity: 0.85;
}

.filter-label-chip.is-on {
  opacity: 1;
  box-shadow: inset 0 0 0 2px var(--text);
}

.filter-due-select {
  width: 100%;
  max-width: none;
  margin-top: 2px;
  background: var(--panel-bg);
  color: var(--text);
  border: 2px solid var(--input-border);
}

.filter-panel-clear {
  width: 100%;
  margin-top: 12px;
  font: inherit;
  font-size: 14px;
  padding: 8px;
  border: none;
  border-radius: 6px;
  background: var(--hover-bg);
  color: var(--text);
  cursor: pointer;
}

.filter-panel-clear:hover {
  background: var(--hover-bg-strong);
}

/* Overflow menu (☰) -------------------------------------------------------- */
.menu-group {
  position: relative;
  margin-left: auto; /* push the menu to the far end of the toolbar */
}

.menu-panel {
  position: absolute;
  top: 100%;
  right: 0;
  z-index: 1500;
  margin-top: 6px;
  width: 230px;
  max-height: 80vh;
  max-height: 80dvh;
  overflow-y: auto;
  padding: 8px;
  background: var(--panel-bg);
  color: var(--text);
  border-radius: 8px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
}

.menu-section {
  padding: 4px 0;
}

.menu-section + .menu-section {
  border-top: 1px solid var(--border);
}

.menu-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  padding: 6px 8px 4px;
}

.menu-item,
.menu-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  box-sizing: border-box;
  padding: 8px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 14px;
  text-align: left;
  cursor: pointer;
}

.menu-item:hover {
  background: var(--hover-bg);
}

.menu-item:disabled {
  opacity: 0.4;
  cursor: default;
}

.menu-item:disabled:hover {
  background: transparent;
}

.menu-icon {
  flex: 0 0 auto;
  width: 22px;
  text-align: center;
}

.menu-select {
  flex: 1 1 auto;
  background: var(--panel-bg);
  color: var(--text);
  border: 2px solid var(--input-border);
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

/* Narrow screens: drop the title and let the search box shrink so the
   essential controls (board, undo/redo, search, menu) fit on one row. */
@media (max-width: 640px) {
  .app-title {
    display: none;
  }
  .filter-input {
    width: 0;
    min-width: 80px;
    flex: 1 1 auto;
  }
  .toolbar {
    gap: 6px;
  }
}

/* Board surface -------------------------------------------------------- */
.board-surface {
  flex: 1;
  overflow: auto;
  padding: 16px;
  /* Keep the board clear of the screen's safe area on foldable/notched devices
     (no effect where the insets are 0). */
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  padding-bottom: max(16px, env(safe-area-inset-bottom));
  -webkit-overflow-scrolling: touch;
}

.board-scale {
  transform-origin: top left;
  width: max-content;
}

.columns {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  min-height: 200px;
}

/* Column --------------------------------------------------------------- */
.column {
  width: 272px;
  flex: 0 0 auto;
  background: var(--column-bg);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  /* JS (LayoutController) sets --column-max-h to the real visible board height,
     so columns never overflow when a foldable opens/closes or the toolbar
     wraps. The calc() fallbacks apply before scripts run or on old browsers;
     dvh tracks the dynamic viewport (browser chrome) better than vh. */
  max-height: calc(100vh - 120px);
  max-height: var(--column-max-h, calc(100dvh - 120px));
}

.column-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  font-weight: 700;
  cursor: grab;
  gap: 6px;
}

.column-title {
  flex: 1;
  word-break: break-word;
}

/* The list's ⋯ menu (sort / copy / move all / archive). */
.column-menu-wrap {
  position: relative;
  flex: 0 0 auto;
}

.column-menu {
  position: absolute;
  top: 100%;
  right: 0;
  z-index: 1200;
  margin-top: 4px;
  width: 210px;
  padding: 6px;
  background: var(--panel-bg);
  color: var(--text);
  border-radius: 8px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
  cursor: default;
}

.column-menu-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  padding: 6px 8px 2px;
}

.column-menu-item {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 7px 8px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  font-weight: 400;
  text-align: left;
  cursor: pointer;
}

.column-menu-item:hover {
  background: var(--hover-bg);
}

/* Card count in a column header (matches/total while a filter is active). */
.column-count {
  flex: 0 0 auto;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  background: var(--tint);
  padding: 1px 6px;
  border-radius: 8px;
}

.cards-list {
  padding: 4px 8px;
  overflow-y: auto;
  flex: 1;
  min-height: 12px;
}

.column-footer {
  padding: 8px;
}

.add-card-btn {
  width: 100%;
  text-align: center;
  font: inherit;
  font-size: 16px;
  padding: 8px;
  border: none;
  background: transparent;
  color: var(--muted);
  border-radius: 6px;
  cursor: pointer;
}

.add-card-btn:hover {
  background: var(--tint);
}

/* Card ----------------------------------------------------------------- */
.card {
  position: relative;
  background: var(--card-bg);
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 8px;
  box-shadow: 0 1px 0 rgba(9, 30, 66, 0.25);
  cursor: grab;
  overflow: hidden;
}

.card-stripe {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 6px;
}

.card-text {
  white-space: pre-wrap;
  word-break: break-word;
  min-height: 18px;
  padding-left: 4px;
}

.card-actions {
  display: flex;
  justify-content: flex-end;
  gap: 2px;
  margin-top: 4px;
  opacity: 0;
  /* Hidden actions must not be tappable; otherwise a touch on the invisible
     delete button would remove the card. Re-enabled together with opacity. */
  pointer-events: none;
  transition: opacity 0.1s;
}

.card:hover .card-actions {
  opacity: 1;
  pointer-events: auto;
}

/* Touch devices have no hover, so the actions would stay invisible yet remain
   in the layout. Keep them visible (and tappable) there. */
@media (hover: none) {
  .card-actions {
    opacity: 1;
    pointer-events: auto;
  }
}

.icon-btn {
  font: inherit;
  font-size: 13px;
  line-height: 1;
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
  color: var(--muted);
}

.icon-btn:hover {
  background: var(--tint-strong);
}

.empty-hint {
  color: var(--muted);
  font-size: 13px;
  padding: 6px 4px;
}

.inline-edit-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.inline-edit {
  width: 100%;
  font: inherit;
  line-height: 1.4;
  box-sizing: border-box;
  border: 2px solid var(--accent);
  border-radius: 4px;
  padding: 6px;
  /* Height is managed by autoGrow() (grows with content up to 20 lines). */
  resize: none;
  overflow-y: hidden;
  min-height: 38px;
}

.inline-edit-actions {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
}

.inline-edit-btn {
  font: inherit;
  font-size: 14px;
  line-height: 1;
  /* Roomy tap target for touch devices. */
  min-width: 36px;
  min-height: 32px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

.inline-edit-ok {
  background: var(--accent);
  color: #fff;
}

.inline-edit-cancel {
  background: var(--tint-strong);
  color: var(--text);
}

.add-column {
  flex: 0 0 auto;
  width: 272px;
  font: inherit;
  font-size: 16px;
  padding: 12px;
  border: none;
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.3);
  color: #fff;
  cursor: pointer;
  text-align: center;
}

.add-column:hover {
  background: rgba(255, 255, 255, 0.45);
}

/* Drag and drop -------------------------------------------------------- */
.drag-clone {
  position: fixed;
  z-index: 1000;
  pointer-events: none;
  opacity: 0.9;
  transform: rotate(2deg);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
}

.card-placeholder,
.column-placeholder {
  border: 2px dashed var(--dash-border);
  border-radius: 6px;
  background: var(--dash-bg);
  margin-bottom: 8px;
}

.column-placeholder {
  flex: 0 0 auto;
}

/* Custom modal dialogs (replace native alert/confirm/prompt) ----------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--overlay);
  padding: 16px;
  animation: modal-fade 0.12s ease-out;
}

.modal-dialog {
  background: var(--panel-bg);
  border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  width: min(420px, 100%);
  padding: 20px;
  animation: modal-pop 0.12s ease-out;
}

.modal-message {
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}

.modal-input {
  width: 100%;
  margin-top: 14px;
  font: inherit;
  font-size: 15px;
  padding: 9px 10px;
  border: 2px solid var(--input-border);
  border-radius: 6px;
}

.modal-input:focus {
  outline: none;
  border-color: var(--accent);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}

.modal-btn {
  font: inherit;
  font-size: 14px;
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  min-height: 38px;
}

.modal-cancel {
  background: var(--hover-bg);
  color: var(--text);
}

.modal-cancel:hover {
  background: var(--hover-bg-strong);
}

.modal-ok {
  background: var(--accent);
  color: #fff;
}

.modal-ok:hover {
  background: var(--accent-strong);
}

/* --- Card detail modal (back of the card) --- */
.card-detail {
  width: min(560px, 100%);
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
}

.card-detail-label {
  margin-top: 14px;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

.card-detail-label:first-child {
  margin-top: 0;
}

.card-detail-title {
  margin-top: 0;
}

.card-detail-desc {
  width: 100%;
  box-sizing: border-box;
  font: inherit;
  font-size: 15px;
  line-height: 1.5;
  min-height: 120px;
  resize: vertical;
  padding: 9px 10px;
  border: 2px solid var(--input-border);
  border-radius: 6px;
}

.card-detail-desc:focus {
  outline: none;
  border-color: var(--accent);
}

.card-detail-colors {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.card-detail-swatch {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  border: 2px solid var(--input-border);
  cursor: pointer;
  padding: 0;
}

.card-detail-swatch.is-none {
  /* The "no accent" swatch shows a diagonal slash over white. */
  background:
    linear-gradient(to top right, transparent 45%, #eb5a46 45%, #eb5a46 55%, transparent 55%),
    var(--panel-bg);
}

.card-detail-swatch.is-selected {
  border-color: var(--text);
  box-shadow: 0 0 0 2px var(--accent);
}

.card-detail-meta {
  margin-top: 16px;
  font-size: 12px;
  color: var(--muted);
}

/* Checklist inside the card detail modal. */
.card-detail-checklist {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.checklist-progress-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.checklist-progress-text {
  flex: 0 0 auto;
  font-size: 12px;
  color: var(--muted);
  min-width: 28px;
}

.checklist-progress {
  flex: 1 1 auto;
  height: 8px;
  border-radius: 4px;
  background: var(--hover-bg);
  overflow: hidden;
}

.checklist-progress-fill {
  height: 100%;
  background: #61bd4f;
  transition: width 0.15s;
}

.checklist-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.checklist-item-text {
  flex: 1 1 auto;
  font: inherit;
  font-size: 14px;
  padding: 6px 8px;
  border: 1px solid transparent;
  border-radius: 6px;
}

.checklist-item-text:hover {
  border-color: var(--border);
}

.checklist-item-text:focus {
  outline: none;
  border-color: var(--accent);
}

.checklist-item-text.is-done {
  text-decoration: line-through;
  color: var(--muted);
}

.checklist-item-del {
  flex: 0 0 auto;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  padding: 4px;
  border-radius: 4px;
}

.checklist-item-del:hover {
  background: var(--hover-bg);
}

.checklist-add {
  display: flex;
  gap: 6px;
  margin-top: 2px;
}

.checklist-add-input {
  flex: 1 1 auto;
  font: inherit;
  font-size: 14px;
  padding: 7px 8px;
  border: 2px solid var(--input-border);
  border-radius: 6px;
}

.checklist-add-input:focus {
  outline: none;
  border-color: var(--accent);
}

.checklist-add-btn {
  flex: 0 0 auto;
  font: inherit;
  font-size: 14px;
  padding: 7px 12px;
  border: none;
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}

/* "Add label" / "add file" buttons below their lists in the card detail modal. */
.card-detail-label-add,
.attachment-add-btn {
  align-self: flex-start;
  font: inherit;
  font-size: 13px;
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  background: var(--hover-bg);
  cursor: pointer;
}

.card-detail-label-add:hover,
.attachment-add-btn:hover {
  background: var(--hover-bg-strong);
}

/* Card actions (copy/move) inside the card detail modal. */
.card-detail-ops {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.card-detail-op-btn {
  font: inherit;
  font-size: 14px;
  padding: 7px 12px;
  border: none;
  border-radius: 6px;
  background: var(--hover-bg);
  cursor: pointer;
}

.card-detail-op-btn:hover {
  background: var(--hover-bg-strong);
}

.card-detail-move {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  align-items: center;
}

.card-detail-move-select {
  flex: 1 1 auto;
  min-width: 0;
}

/* Attachments inside the card detail modal. */
.card-detail-attachments {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.attachment-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px;
  border-radius: 6px;
  background: var(--soft-bg);
}

.attachment-thumb {
  flex: 0 0 auto;
  width: 64px;
  height: 48px;

  border-radius: 4px;

.attachment-info {

  min-width: 0;
}

.attachment-name {

}

.attachment-date {
  font-size: 11px;
  color: var(--muted);
}

.card-template {
  background: #e4f0f6;
  color: #0c66e4;
  font-weight: 600;
}

.card-cover {
  display: block;
  width: 100%;
  max-height: 140px;
  object-fit: cover;
  border-radius: var(--radius) var(--radius) 0 0;
  pointer-events: none;

.card-detail-comments {
  display: flex;
  flex-direction: column;
  gap: 8px;

.comment-add {
  display: flex;
  gap: 6px;
  align-items: flex-start;
}

.comment-add-input {
  flex: 1 1 auto;
  font: inherit;
  font-size: 14px;
  padding: 7px 8px;
  border: 2px solid var(--input-border);
  border-radius: 6px;
  resize: vertical;
}

.comment-add-input:focus {
  outline: none;
  border-color: var(--accent);
}

.comment-add-btn {
  flex: 0 0 auto;
  font: inherit;
  font-size: 14px;
  padding: 7px 12px;
  border: none;
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;

.comment-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px;
  border-radius: 6px;
  background: var(--soft-bg);
}

.comment-meta {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--muted);
}

.comment-date {
  flex: 1 1 auto;
}

.comment-btn {
  flex: 0 0 auto;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  padding: 3px 5px;
  border-radius: 4px;
}

.comment-btn:hover {
  background: var(--hover-bg);
}

.comment-text {
  font-size: 14px;
  white-space: pre-wrap;
  word-break: break-word;
}

.comment-edit-actions {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
}

.card-detail .card-detail-delete {
  /* Push the delete button to the far left, away from cancel/save. */
  margin-right: auto;
  background: #ffebe6;
  color: #bf2600;
}

.card-detail .card-detail-delete:hover {
  background: #ffd6cc;
}

.activity-row {
  padding: 8px;
  border-radius: 6px;
}

.activity-row:nth-child(odd) {
  background: var(--soft-bg);
}

.activity-text {
  font-size: 14px;
  word-break: break-word;
}

.activity-when {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.card-archive {
  width: min(560px, 100%);
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
}

.archive-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}

.archive-empty {
  color: var(--muted);
  font-size: 14px;
  padding: 12px 4px;
  text-align: center;
}

.archive-section-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin: 6px 0 2px;
}

.archive-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
}

.archive-info {
  flex: 1 1 auto;
  min-width: 0;
}

.archive-text {
  white-space: pre-wrap;
  word-break: break-word;
}

.archive-origin {
  margin-top: 2px;
  font-size: 12px;
  color: var(--muted);
}

.archive-btn {
  flex: 0 0 auto;
  font: inherit;
  font-size: 13px;
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  min-height: 32px;
}

.archive-restore {
  background: var(--accent);
  color: #fff;
}

.archive-delete {
  background: #ffebe6;
  color: #bf2600;
}

.archive-delete:hover {
  background: #ffd6cc;
}

.card-labels {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 6px;
}

.card-label {
  min-width: 36px;
  max-width: 100%;
  height: 16px;
  padding: 0 6px;
  border-radius: 8px;
  font-size: 11px;
  line-height: 16px;
  color: #fff;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Label rows inside the card detail modal. */
.card-detail-labels {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.card-detail-label-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-detail-label-chip {
  flex: 1 1 auto;
  min-height: 32px;
  padding: 0 10px;
  border: none;
  border-radius: 6px;
  color: #fff;
  font: inherit;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  opacity: 0.85;
}

.card-detail-label-chip.is-on {
  opacity: 1;
  box-shadow: inset 0 0 0 2px var(--text);
}

.card-detail-label-edit {
  flex: 0 0 auto;
  min-width: 36px;
  min-height: 32px;
  border: none;
  border-radius: 6px;
  background: var(--hover-bg);
  cursor: pointer;
  font-size: 14px;
}

.card-detail-label-edit:hover {
  background: var(--hover-bg-strong);
}

/* Description / due-date badges on the card face. */
.card-badges {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
}

.card-badge {
  font-size: 12px;
  line-height: 1;
  opacity: 0.7;
}

.card-due,
.card-check {
  display: inline-flex;
  align-items: center;
  padding: 2px 6px;
  border-radius: 6px;
  font-weight: 600;
  opacity: 1;
  background: var(--hover-bg);
  color: var(--text);
}

.card-check.is-complete {
  background: #e3fcef;
  color: #006644;
}

.card-due.is-overdue {
  background: #ffebe6;
  color: #bf2600;
}

.card-due.is-soon {
  background: #fffae6;
  color: #974f0c;
}

.card-due.is-done {
  background: #e3fcef;
  color: #006644;
  text-decoration: line-through;
}

.card-detail-due {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.card-detail-due-input {
  font: inherit;
  font-size: 15px;
  padding: 8px 10px;
  border: 2px solid var(--input-border);
  border-radius: 6px;
}

.card-detail-due-input:focus {
  outline: none;
  border-color: var(--accent);
}

.card-detail-due-done {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--text);
  cursor: pointer;
}

  font-size: 14px;
  padding: 7px 12px;
  border: none;
  border-radius: 6px;
  background: var(--hover-bg);
  color: var(--text);
  cursor: pointer;
}

.card-detail-due-clear:hover {
  background: var(--hover-bg-strong);
}

@keyframes modal-fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modal-pop {
  from { transform: translateY(8px) scale(0.98); opacity: 0; }
  to { transform: none; opacity: 1; }
}

/* High-DPI / foldable large screens: show more columns comfortably. */
@media (min-width: 1600px) {
  .app-title {
    font-size: 20px;
