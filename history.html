    <li>프로젝트 가이드라인 문서(CLAUDE.md)를 정리·완성했습니다.</li>

    <li>기본 원칙·실행 제약·지원 환경 섹션을 명확히 분리하고 누락된 항목을 보강했습니다.</li>
  </ul>
