<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>칸반 보드</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="toolbar">
    <h1 class="app-title" data-i18n="appTitle">칸반 보드</h1>

    <div class="toolbar-group">
      <label class="visually-hidden" for="boardSelect" data-i18n="boards">보드</label>
      <select id="boardSelect" class="control" title="boards"></select>
      <button id="starBtn" class="control icon-control" data-i18n-title="starBoard">☆</button>
    </div>

    <div class="toolbar-group">
      <button id="undoBtn" class="control icon-control" data-i18n-title="undo">↶</button>
      <button id="redoBtn" class="control icon-control" data-i18n-title="redo">↷</button>
    </div>

    <div class="toolbar-group filter-group">
      <input id="filterInput" class="control filter-input" type="search"
             data-i18n-placeholder="searchPlaceholder" />
      <button id="filterBtn" class="control icon-control" data-i18n-title="filter">🔎</button>
      <button id="filterClearBtn" class="control icon-control" data-i18n-title="clearFilter" hidden>✖️</button>
      <div id="filterPanel" class="filter-panel" hidden></div>
    </div>

    <div class="toolbar-group menu-group">
      <button id="menuBtn" class="control icon-control" data-i18n-title="menu">☰</button>
      <div id="menuPanel" class="menu-panel" hidden>
        <div class="menu-section">
          <div class="menu-title" data-i18n="boards">보드</div>
          <button id="newBoardBtn" class="menu-item">
            <span class="menu-icon">🆕</span><span class="menu-label" data-i18n="newBoard">새 보드</span>
          </button>
          <button id="renameBoardBtn" class="menu-item">
            <span class="menu-icon">✏️</span><span class="menu-label" data-i18n="rename">이름 변경</span>
          </button>
          <button id="deleteBoardBtn" class="menu-item">
            <span class="menu-icon">🗑️</span><span class="menu-label" data-i18n="delete">삭제</span>
          </button>
          <button id="archiveBtn" class="menu-item">
            <span class="menu-icon">🗄️</span><span class="menu-label" data-i18n="archiveView">보관함</span>
          </button>
          <button id="bgColorBtn" class="menu-item">
            <span class="menu-icon">🎨</span><span class="menu-label" data-i18n="background">배경색</span>
          </button>
          <button id="activityBtn" class="menu-item">
            <span class="menu-icon">📜</span><span class="menu-label" data-i18n="activityLog">활동 로그</span>
          </button>
        </div>

        <div class="menu-section">
          <div class="menu-title" data-i18n="view">보기</div>
          <button id="zoomInBtn" class="menu-item">
            <span class="menu-icon">🔍➕</span><span class="menu-label" data-i18n="zoomIn">확대</span>
          </button>
          <button id="zoomOutBtn" class="menu-item">
            <span class="menu-icon">🔍➖</span><span class="menu-label" data-i18n="zoomOut">축소</span>
          </button>
          <button id="zoomResetBtn" class="menu-item">
            <span class="menu-icon">↩️</span><span class="menu-label" data-i18n="zoomReset">원래대로</span>
          </button>
        </div>

        <div class="menu-section">
          <div class="menu-title" data-i18n="data">데이터</div>
          <button id="exportJsonBtn" class="menu-item">
            <span class="menu-icon">💾</span><span class="menu-label" data-i18n="exportJson">JSON 내보내기</span>
          </button>
          <label id="importJsonLabel" class="menu-item" for="importJsonInput">
            <span class="menu-icon">📂</span><span class="menu-label" data-i18n="importJson">JSON 가져오기</span>
          </label>
          <input id="importJsonInput" type="file" accept="application/json,.json" hidden />
          <button id="exportPngBtn" class="menu-item">
            <span class="menu-icon">🖼️</span><span class="menu-label" data-i18n="exportPng">PNG 저장</span>
          </button>
        </div>

        <div class="menu-section">
          <div class="menu-title" data-i18n="language">언어</div>
          <div class="menu-row">
            <span class="menu-icon">🌐</span>
            <select id="langSelect" class="control menu-select" title="language">
              <option value="ko">한국어</option>
              <option value="en">English</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="boardSurface" class="board-surface">
    <div id="boardScale" class="board-scale">
      <div id="columns" class="columns"></div>
    </div>
  </main>

  <script type="module" src="./js/src/main.js"></script>
</body>
</html>
